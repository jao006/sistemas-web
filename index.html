<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Loja</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Painel Loja</h1>

    <nav>
        <button onclick="mostrarTela('login')">Login</button>
        <button onclick="mostrarTela('produtos')">Produtos</button>
        <button onclick="mostrarTela('admin')">Admin</button>
        <button onclick="mostrarTela('perfil')">Perfil</button>
    </nav>

    <section id="tela-login">
        <h2>Tela de Login</h2>
        <form id="form-login">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="senha" placeholder="Senha">
            <button type="submit">Entrar</button>
        </form>
    </section>

    <section id="tela-produtos" style="display: none;">
        <h2>Tela Produtos</h2>
        <p>Aqui entrará a lista vinda da API (aula 4).</p>
    </section>

    <section id="tela-admin" style="display: none;">
        <h2>Área Admin</h2>
        <form id="form-produto">
            <input type="text" id="nome-produto" placeholder="Nome do produto">
            <input type="number" id="preco" placeholder="Preco" step="0.01">
            <button type="submit">Cadastrar</button>
        </form>
        <p id="mensagem-produto"></p>
    </section>

    <section id="tela-perfil" style="display: none;">
        <h2>Perfil</h2>
        <p>Só eu posso acessar meu perfil.</p>
    </section>

    <script>
        function mostrarTela(nome) {

            const telas = document.querySelectorAll('section');

            telas.forEach(tela => {
                tela.style.display = 'none';
            });

            const telaEscolhida = document.getElementById('tela-' + nome);

            telaEscolhida.style.display = 'block';
        }

        const formLogin = document.getElementById('form-login');

        formLogin.addEventListener('submit', function(evento){

            evento.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: email,
                    senha: senha
                })
            })
            .then(resposta => resposta.json())
            .then(dados => {
                console.log(dados);
            })
            .catch(erro => {
                console.log(erro);
            });

        });

        const formProduto = document.getElementById('form-produto');

        formProduto.addEventListener('submit', function(evento){

            evento.preventDefault();

            const nome = document.getElementById('nome-produto').value;
            const preco = document.getElementById('preco').value;

            if(nome === '' || preco === ''){
                document.getElementById('mensagem-produto').textContent = 'Preencha nome e preço';
                return;
            }

            if(Number(preco) <= 0){
                document.getElementById('mensagem-produto').textContent = 'O preço precisa ser maior que zero';
                return;
            }

            fetch('http://localhost:3000/produtos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    nome: nome,
                    preco: Number(preco)
                })
            })
            .then(resposta => resposta.json())
            .then(dados => {
                document.getElementById('mensagem-produto').textContent = 'Produtos Cadastrados!';
            })
            .catch(erro => {
                console.log(erro);
                document.getElementById('mensagem-produto').textContent = 'Erro ao cadastrar produto';
            });

        });

    </script>

</body>
</html>
